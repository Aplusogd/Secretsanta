<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa's Family Party 🎄</title>
    
    <!-- 1. The Design Tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@500;700&display=swap');
      
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #fff1f2; /* Light Pink/Red */
        background-image: radial-gradient(#fecdd3 3px, transparent 3px);
        background-size: 30px 30px;
        color: #881337;
        min-height: 100vh;
      }
      
      .font-fun { font-family: 'Chewy', cursive; }
      
      .cute-card {
        background: white;
        border: 4px solid #fecdd3;
        box-shadow: 8px 8px 0px #fb7185;
        border-radius: 2rem;
        transition: transform 0.2s;
      }
      
      .btn-mega {
        background: #f43f5e;
        color: white;
        font-family: 'Chewy', cursive;
        font-size: 1.5rem;
        padding: 1rem;
        border-radius: 1.5rem;
        border: 2px solid white;
        box-shadow: 0 6px 0 #9f1239;
        transition: all 0.1s;
      }
      .btn-mega:active { transform: translateY(6px); box-shadow: none; }
      .btn-mega:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #9f1239; }
      .btn-mega:disabled { background: #fda4af; box-shadow: none; cursor: not-allowed; transform: none; }

      .animate-float { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
      
      .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // --- RANDOM HELPERS ---
      const randomCode = () => {
        const adjs = ['HAPPY', 'JOL', 'SNOW', 'ELFY', 'GIFT'];
        const nums = Math.floor(Math.random() * 90 + 10);
        return adjs[Math.floor(Math.random()*adjs.length)] + "-" + nums;
      };

      const cuteLoadingMessages = [
        "Checking the Naughty List...",
        "Wrapping the presents...",
        "Feeding the reindeer...",
        "Drinking hot cocoa...",
        "Polishing the sleigh..."
      ];

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('HOME'); 
        
        // Host State
        const [roomCode, setRoomCode] = useState("");
        const [players, setPlayers] = useState([]); 
        const [hostConn, setHostConn] = useState(null); 
        const [connections, setConnections] = useState([]); 

        // Guest State
        const [guestName, setGuestName] = useState("");
        const [guestWish, setGuestWish] = useState("");
        const [myMatch, setMyMatch] = useState(null);
        const [loadingMsg, setLoadingMsg] = useState("");

        // 1. Check URL for Room Code
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const room = params.get('party');
          if (room) {
            setRoomCode(room);
            setView('GUEST_JOIN');
          }
        }, []);

        // --- HOST: START PARTY ---
        const startParty = () => {
          const code = randomCode();
          setRoomCode(code);
          setView('HOST_LOBBY');
          
          const peer = new Peer(code.replace('-', ''), { debug: 1 });
          
          peer.on('open', (id) => {
            console.log("Party started at:", id);
          });

          peer.on('connection', (conn) => {
            conn.on('open', () => {
              // 1. Handshake
              conn.send({ type: 'HELLO' });
              setConnections(prev => [...prev, conn]);

              conn.on('data', (data) => {
                if (data.type === 'JOIN') {
                  setPlayers(prev => {
                    const exists = prev.find(p => p.id === conn.peer);
                    if (exists) return prev;
                    return [...prev, { id: conn.peer, name: data.name, wish: data.wish }];
                  });
                  // Tell guest they are in
                  conn.send({ type: 'JOINED' });
                }
              });

              conn.on('close', () => {
                setPlayers(prev => prev.filter(p => p.id !== conn.peer));
              });
            });
          });

          peer.on('error', (err) => {
            alert("Oops! Code might be taken. Try refreshing.");
            setView('HOME');
          });

          setHostConn(peer);
        };

        const shuffleAndSend = () => {
          if (players.length < 2) return alert("You need at least 2 people!");
          
          let shuffled = [...players];
          let valid = false;
          
          // Simple Shuffle Logic
          for(let k=0; k<50; k++) {
            for(let i=shuffled.length-1; i>0; i--) {
              const j = Math.floor(Math.random()*(i+1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
            if(valid) break;
          }

          if(!valid) return alert("Shuffle failed. Add more people!");

          // Send data to phones
          players.forEach((p, i) => {
            const match = shuffled[i];
            const conn = connections.find(c => c.peer === p.id);
            if(conn) conn.send({ type: 'MATCH', name: match.name, wish: match.wish });
          });

          alert("🎁 Sent! Tell everyone to check their phones!");
        };

        // --- GUEST: JOIN PARTY ---
        const joinParty = (e) => {
          e.preventDefault();
          if(!guestName || !guestWish) return alert("Please fill in the boxes!");
          
          setView('GUEST_WAITING');
          setLoadingMsg(cuteLoadingMessages[Math.floor(Math.random()*cuteLoadingMessages.length)]);

          const peer = new Peer(null, { debug: 1 });
          
          peer.on('open', () => {
            const conn = peer.connect(roomCode.replace('-', ''));
            
            conn.on('open', () => {
              // Wait for Hello
            });

            conn.on('data', (data) => {
              if (data.type === 'HELLO') {
                conn.send({ type: 'JOIN', name: guestName, wish: guestWish });
              }
              if (data.type === 'JOINED') {
                setLoadingMsg("Waiting for Host to Shuffle...");
              }
              if (data.type === 'MATCH') {
                setMyMatch({ name: data.name, wish: data.wish });
                setView('GUEST_REVEAL');
                window.confetti({ particleCount: 200, spread: 100 });
              }
            });

            conn.on('error', () => {
              alert("Can't find that party! Is the Host screen open?");
              setView('GUEST_JOIN');
            });
          });
        };

        // --- VIEWS ---

        // 1. HOME SCREEN
        if (view === 'HOME') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="cute-card max-w-sm w-full p-8 text-center space-y-8 animate-pop">
                <div className="text-6xl animate-float">🎅</div>
                <div>
                  <h1 className="font-fun text-5xl text-pink-600">Secret Santa</h1>
                  <p className="text-pink-400 font-bold">The Family Party Game</p>
                </div>
                
                <button onClick={startParty} className="btn-mega w-full bg-red-500">
                  Start a New Party!
                </button>
                
                <div className="relative py-2">
                  <div className="absolute inset-0 flex items-center"><div className="w-full border-t-2 border-pink-200"></div></div>
                  <div className="relative flex justify-center text-xs text-pink-300 font-bold bg-white px-2">OR JOIN ONE</div>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); setView('GUEST_JOIN'); }} className="flex gap-2">
                  <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-24 text-center border-2 border-pink-200 rounded-xl outline-none font-bold text-pink-500 p-2" />
                  <button className="flex-1 bg-white border-2 border-pink-400 text-pink-500 font-bold rounded-xl hover:bg-pink-50">Join</button>
                </form>
              </div>
            </div>
          );
        }

        // 2. HOST LOBBY
        if (view === 'HOST_LOBBY') {
          const shareUrl = `${window.location.origin}${window.location.pathname}?party=${roomCode}`;
          return (
            <div className="min-h-screen p-4 pb-32 max-w-lg mx-auto">
              <div className="text-center mt-6 mb-6 animate-pop">
                <div className="inline-block bg-yellow-300 text-yellow-800 px-4 py-2 rounded-full font-fun text-2xl transform -rotate-2 border-2 border-white shadow-md">
                  Code: {roomCode}
                </div>
                <h1 className="font-fun text-4xl text-red-600 mt-4">Who's Here?</h1>
                <p className="text-red-400 text-sm font-bold">Don't close this screen!</p>
              </div>

              <div className="cute-card p-4 mb-6 text-center">
                 <p className="text-xs font-bold text-pink-400 uppercase mb-2">Send this link to the Group Chat</p>
                 <button onClick={() => { navigator.clipboard.writeText(shareUrl); alert("Copied!"); }} className="w-full bg-pink-50 text-pink-600 p-3 rounded-xl border-2 border-pink-200 font-bold break-all hover:bg-pink-100 active:scale-95 transition">
                   {shareUrl} <br/><span className="text-xs">📋 Tap to Copy</span>
                 </button>
              </div>

              <div className="space-y-3">
                <h3 className="font-bold text-pink-800 ml-2">Elves in the Room ({players.length})</h3>
                {players.map(p => (
                  <div key={p.id} className="bg-white border-2 border-green-200 p-4 rounded-2xl flex items-center justify-between shadow-sm animate-pop">
                    <div>
                      <div className="font-bold text-green-800 text-lg">{p.name}</div>
                      <div className="text-xs text-green-600 font-medium">"{p.wish}"</div>
                    </div>
                    <div className="text-2xl">🧝</div>
                  </div>
                ))}
                {players.length === 0 && <div className="text-center py-8 text-pink-300 font-bold animate-pulse">Waiting for family to join...</div>}
              </div>

              {players.length > 1 && (
                <div className="fixed bottom-6 left-4 right-4 max-w-lg mx-auto">
                  <button onClick={shuffleAndSend} className="btn-mega w-full bg-green-500 hover:bg-green-600 shadow-[0_6px_0_#15803d]">
                    Shuffle & Match! 🎲
                  </button>
                </div>
              )}
            </div>
          );
        }

        // 3. GUEST JOIN
        if (view === 'GUEST_JOIN') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="cute-card max-w-sm w-full p-8 animate-pop">
                <div className="text-center mb-6">
                  <span className="bg-yellow-200 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold">ROOM: {roomCode}</span>
                  <h1 className="font-fun text-4xl text-pink-600 mt-2">Join In!</h1>
                </div>
                {!roomCode && <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-full text-center p-3 border-2 border-pink-200 rounded-xl mb-4 font-bold" />}
                
                <form onSubmit={joinParty} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-pink-400 uppercase ml-1">Your Name</label>
                    <input value={guestName} onChange={e => setGuestName(e.target.value)} className="w-full p-4 border-2 border-pink-200 rounded-xl outline-none focus:border-pink-500 font-bold text-lg text-pink-600" placeholder="e.g. Grandma" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-pink-400 uppercase ml-1">What I really want for Christmas 🎁</label>
                    <input value={guestWish} onChange={e => setGuestWish(e.target.value)} className="w-full p-4 border-2 border-pink-200 rounded-xl outline-none focus:border-pink-500 text-pink-600" placeholder="e.g. Fuzzy socks, LEGOs..." />
                  </div>
                  <button className="btn-mega w-full bg-pink-500 mt-4">I'm Ready!</button>
                </form>
              </div>
            </div>
          );
        }

        // 4. WAITING SCREEN
        if (view === 'GUEST_WAITING') {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center animate-pop">
              <div className="text-6xl animate-bounce mb-6">🎄</div>
              <h2 className="font-fun text-4xl text-pink-600 mb-2">You're In!</h2>
              <p className="text-pink-800 font-bold text-lg">{loadingMsg}</p>
              <div className="mt-8 bg-white p-4 rounded-xl border-2 border-pink-100 text-sm text-pink-400 max-w-xs">
                Don't close your phone! Wait for the host to press the button.
              </div>
            </div>
          );
        }

        // 5. REVEAL
        if (view === 'GUEST_REVEAL') {
          const [open, setOpen] = useState(false);
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center animate-pop">
              <h1 className="font-fun text-5xl text-red-600 mb-2">Secret Santa</h1>
              <p className="text-pink-400 font-bold uppercase tracking-widest mb-8">You have a match!</p>
              
              {!open ? (
                <button onClick={() => { setOpen(true); window.confetti({ particleCount: 200, spread: 100 }); }} className="w-64 h-64 rounded-full bg-red-500 shadow-[0_10px_0_#9f1239] flex flex-col items-center justify-center text-white border-4 border-white hover:scale-105 transition active:translate-y-2 active:shadow-none cursor-pointer">
                  <div className="text-6xl animate-bounce mb-2">🎁</div>
                  <span className="font-fun text-3xl">OPEN ME!</span>
                </button>
              ) : (
                <div className="cute-card w-full max-w-sm p-8 border-t-8 border-green-400 animate-pop relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-full bg-green-50 opacity-50 z-0"></div>
                  <div className="relative z-10">
                    <p className="text-xs font-bold text-gray-400 uppercase mb-4">You are buying for</p>
                    <div className="text-5xl font-fun text-green-700 mb-6 drop-shadow-sm">{myMatch.name}</div>
                    
                    <div className="bg-white p-6 rounded-2xl border-2 border-green-200 text-green-800 shadow-sm transform -rotate-1">
                      <p className="text-xs font-bold uppercase opacity-50 mb-1">Their Christmas Wish</p>
                      <p className="text-xl font-bold">"{myMatch.wish}"</p>
                    </div>
                    
                    <p className="text-xs text-gray-400 mt-6 font-bold">📸 Screenshot this!</p>
                  </div>
                </div>
              )}
            </div>
          );
        }

        return null;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
