<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa's Command Center 🎅</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Mountains+of+Christmas:wght@700&display=swap');
      
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #fef2f2;
        background-image: radial-gradient(#fee2e2 2px, transparent 2px);
        background-size: 24px 24px;
        color: #991b1b;
      }
      
      .font-christmas { font-family: 'Mountains of Christmas', cursive; }
      
      .snow-card {
        background: white;
        border: 4px solid #fecaca;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border-radius: 1.5rem;
      }

      .btn-primary {
        background: #dc2626;
        color: white;
        font-weight: bold;
        padding: 1rem;
        border-radius: 1rem;
        box-shadow: 0 4px 0 #991b1b;
        transition: transform 0.1s;
      }
      .btn-primary:active { transform: translateY(4px); box-shadow: none; }
      .btn-primary:disabled { background: #fca5a5; box-shadow: none; cursor: not-allowed; }

      .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const ADMIN_PASSCODE = "butts";

      // --- HELPERS ---
      const generateRoomCode = () => {
        const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
        let result = '';
        for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        return result;
      };

      // --- ICONS ---
      const Icon = ({ name }) => {
        if (name === 'santa') return <span className="text-4xl">🎅</span>;
        if (name === 'back') return <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>;
        if (name === 'eye') return <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>;
        if (name === 'gift') return <span className="text-4xl">🎁</span>;
        return null;
      };

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('HOME'); 
        
        // Host State
        const [roomCode, setRoomCode] = useState("");
        const [hostPeer, setHostPeer] = useState(null);
        const [players, setPlayers] = useState([]); 
        const [connections, setConnections] = useState([]);
        const [isStartingHost, setIsStartingHost] = useState(false);

        // Guest State
        const [guestName, setGuestName] = useState("");
        const [guestWish, setGuestWish] = useState("");
        const [myMatch, setMyMatch] = useState(null);
        const [joinStatus, setJoinStatus] = useState("");

        // 1. Check URL on Load
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const room = params.get('room');
          if (room) {
            setRoomCode(room);
            setView('GUEST_FORM');
          }
        }, []);

        // --- HOST LOGIC ---
        const startHosting = () => {
          setIsStartingHost(true);
          const code = generateRoomCode();
          
          // Initialize P2P
          const peer = new Peer(code, { debug: 1 });
          
          peer.on('open', (id) => {
            console.log("Host Open:", id);
            setRoomCode(code);
            setIsStartingHost(false);
            setView('HOST_LOBBY');
          });

          peer.on('connection', (conn) => {
            conn.on('open', () => {
              setConnections(prev => [...prev, conn]);
              
              // 1. Send "WELCOME" handshake
              conn.send({ type: 'WELCOME' });

              // 2. Listen for their data
              conn.on('data', (data) => {
                if (data.type === 'JOIN_REQUEST') {
                  setPlayers(prev => {
                    const exists = prev.find(p => p.id === conn.peer);
                    if (exists) return prev;
                    return [...prev, { id: conn.peer, name: data.name, wish: data.wish }];
                  });
                  conn.send({ type: 'JOIN_CONFIRMED' });
                }
              });
              
              conn.on('close', () => {
                 setPlayers(prev => prev.filter(p => p.id !== conn.peer));
              });
            });
          });

          peer.on('error', (err) => {
             console.error("Host Error:", err);
             setIsStartingHost(false);
             alert("Could not start party server. Try refreshing.");
          });

          setHostPeer(peer);
        };

        const stopHost = () => {
          if (confirm("Close the room?")) {
             if (hostPeer) hostPeer.destroy();
             setPlayers([]);
             setView('HOME');
             window.history.replaceState({}, '', window.location.pathname);
          }
        };

        const shuffleAndSend = () => {
          if (players.length < 2) return alert("Need at least 2 elves!");
          
          let shuffled = [...players];
          let valid = false;
          
          for(let k=0; k<100; k++) {
            for(let i=shuffled.length-1; i>0; i--) {
              const j = Math.floor(Math.random()*(i+1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
            if (valid) break;
          }

          if (!valid) return alert("Shuffle failed. Add more people.");

          players.forEach((p, i) => {
            const target = shuffled[i];
            const conn = connections.find(c => c.peer === p.id);
            if (conn) {
              conn.send({ type: 'REVEAL', targetName: target.name, targetWish: target.wish });
            }
          });
          
          alert("Sent! Check phones!");
        };

        // --- GUEST LOGIC ---
        const joinRoom = (e) => {
          e.preventDefault();
          if (!guestName || !guestWish) return alert("Fill in the form!");
          
          setJoinStatus("Connecting...");
          
          const peer = new Peer(null, { debug: 1 });
          
          peer.on('open', (id) => {
            const conn = peer.connect(roomCode);
            
            conn.on('open', () => {
               // Wait for Host Welcome
            });

            conn.on('data', (data) => {
              if (data.type === 'WELCOME') {
                setJoinStatus("Sending Name...");
                conn.send({ type: 'JOIN_REQUEST', name: guestName, wish: guestWish });
              }
              if (data.type === 'JOIN_CONFIRMED') {
                setJoinStatus("Joined!");
                setView('GUEST_LOBBY');
              }
              if (data.type === 'REVEAL') {
                setMyMatch({ name: data.targetName, wish: data.targetWish });
                setView('GUEST_REVEAL');
                window.confetti();
              }
            });
            
            conn.on('error', (err) => {
              alert("Connection failed. Is the host page open?");
              setJoinStatus("");
            });
          });
          
          peer.on('error', (err) => {
            alert("Connection error. Try refreshing.");
            setJoinStatus("");
          });
        };

        // --- UI COMPONENTS ---

        // 1. HOME
        if (view === 'HOME') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="snow-card max-w-sm w-full p-8 text-center space-y-6 animate-pop">
                <Icon name="santa" />
                <h1 className="font-christmas text-5xl text-red-700">Santa's Party</h1>
                <button onClick={() => setView('ADMIN_LOGIN')} className="btn-primary w-full">Start Party (Admin)</button>
                <div className="border-t border-red-100 pt-4 mt-4">
                   <p className="text-xs text-red-300 mb-2 font-bold uppercase">Joining a party?</p>
                   <form onSubmit={(e) => { e.preventDefault(); setView('GUEST_FORM'); }} className="flex gap-2">
                     <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-24 text-center border-2 border-red-200 rounded-lg outline-none font-bold text-red-800" maxLength={4} />
                     <button className="bg-white border-2 border-red-500 text-red-500 font-bold rounded-lg px-4 flex-1">Join</button>
                   </form>
                </div>
              </div>
            </div>
          );
        }

        // 2. ADMIN LOGIN (FIXED)
        if (view === 'ADMIN_LOGIN') {
          const [pass, setPass] = useState("");
          const [showPass, setShowPass] = useState(false);
          const [error, setError] = useState("");

          const check = (e) => {
            e.preventDefault();
            setError("");
            if (pass.trim().toLowerCase() === ADMIN_PASSCODE) {
              startHosting();
            } else {
              setError("Wrong passcode! Try 'butts'");
            }
          }

          return (
            <div className="min-h-screen flex items-center justify-center p-4">
               <div className="snow-card max-w-sm w-full p-8 text-center space-y-4 animate-pop">
                 <button onClick={() => setView('HOME')} className="absolute top-4 left-4 text-gray-400"><Icon name="back"/></button>
                 <h2 className="font-christmas text-3xl">Admin Login</h2>
                 <form onSubmit={check} className="space-y-4">
                   <div className="relative">
                     <input 
                       type={showPass ? "text" : "password"} 
                       value={pass} 
                       onChange={e => setPass(e.target.value)} 
                       placeholder="Enter Passcode" 
                       className="w-full p-3 border-2 border-red-100 rounded-xl text-center outline-none focus:border-red-400" 
                       autoFocus 
                     />
                     <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-3 text-gray-400">
                       <Icon name="eye" />
                     </button>
                   </div>
                   {error && <p className="text-red-500 text-xs font-bold">{error}</p>}
                   
                   <button disabled={isStartingHost} className="btn-primary w-full flex justify-center">
                     {isStartingHost ? "Starting Server..." : "Unlock Party"}
                   </button>
                 </form>
               </div>
            </div>
          );
        }

        // 3. HOST LOBBY
        if (view === 'HOST_LOBBY') {
          const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
          return (
            <div className="min-h-screen p-4 pb-32 max-w-lg mx-auto">
              <div className="flex justify-between items-center mb-6 pt-4">
                 <button onClick={stopHost} className="text-red-400 font-bold text-sm flex items-center gap-1"><Icon name="back" /> Close</button>
                 <div className="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold border border-yellow-300">CODE: {roomCode}</div>
              </div>
              <div className="text-center mb-6">
                <h1 className="font-christmas text-4xl text-red-800">Santa's Dashboard</h1>
                <p className="text-red-400 text-xs mt-1">Keep this screen open!</p>
              </div>
              <div className="bg-white p-4 rounded-xl border-2 border-green-200 mb-6 text-center">
                <p className="text-xs font-bold text-green-700 uppercase mb-2">Invite Link</p>
                <button onClick={() => { navigator.clipboard.writeText(url); alert("Link Copied!"); }} className="bg-green-50 text-green-800 font-mono text-xs p-3 rounded-lg w-full break-all border border-green-200">
                  {url} <br/> <span className="font-bold block mt-2">(Tap to Copy)</span>
                </button>
              </div>
              <div className="space-y-3">
                 <div className="flex justify-between px-2 text-xs font-bold text-gray-400 uppercase">
                   <span>Friends ({players.length})</span>
                   {players.length === 0 && <span className="animate-pulse text-red-400">Waiting...</span>}
                 </div>
                 {players.map((p) => (
                   <div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500 flex justify-between items-center animate-pop">
                     <div>
                       <div className="font-bold text-gray-800">{p.name}</div>
                       <div className="text-xs text-gray-500">"{p.wish}"</div>
                     </div>
                     <span className="text-green-500 font-bold text-xs bg-green-50 px-2 py-1 rounded">READY</span>
                   </div>
                 ))}
              </div>
              {players.length > 1 && (
                <div className="fixed bottom-6 left-4 right-4 max-w-lg mx-auto">
                   <button onClick={shuffleAndSend} className="btn-primary w-full text-xl shadow-xl flex items-center justify-center gap-2">
                     <Icon name="gift" /> Shuffle & Send
                   </button>
                </div>
              )}
            </div>
          );
        }

        // 4. GUEST FORM
        if (view === 'GUEST_FORM') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="snow-card max-w-sm w-full p-8 animate-pop">
                <div className="text-center mb-6">
                  <span className="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">ROOM {roomCode}</span>
                  <h1 className="font-christmas text-4xl text-green-900 mt-2">Join Party</h1>
                </div>
                {!roomCode && <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-full text-center p-3 border-2 border-red-100 rounded-lg mb-4 font-bold" maxLength={4} />}
                <form onSubmit={joinRoom} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-gray-400 uppercase">Your Name</label>
                    <input value={guestName} onChange={e => setGuestName(e.target.value)} className="w-full p-3 border-2 border-green-100 rounded-lg outline-none font-bold" placeholder="e.g. Buddy" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-400 uppercase">Weird Fact / Wish</label>
                    <input value={guestWish} onChange={e => setGuestWish(e.target.value)} className="w-full p-3 border-2 border-green-100 rounded-lg outline-none" placeholder="e.g. I like socks" />
                  </div>
                  <button disabled={!!joinStatus} className="btn-primary w-full bg-green-600 shadow-green-800 border-green-800">
                    {joinStatus || "Join Now"}
                  </button>
                </form>
              </div>
            </div>
          );
        }

        // 5. GUEST LOBBY
        if (view === 'GUEST_LOBBY') {
          return (
             <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center animate-pop">
               <div className="text-6xl animate-bounce mb-4">⏳</div>
               <h2 className="font-christmas text-4xl text-green-900 mb-2">You're In!</h2>
               <p className="text-green-700 font-medium mb-8">Waiting for Santa (Admin) to shuffle...</p>
               <div className="bg-white p-4 rounded-xl border border-gray-200 text-sm text-gray-500 max-w-xs shadow-sm">
                 <p className="font-bold text-red-500 mb-1">⚠️ Do not close!</p>
                 Keep this screen open or you will lose your spot.
               </div>
             </div>
          );
        }

        // 6. GUEST REVEAL
        if (view === 'GUEST_REVEAL') {
          const [open, setOpen] = useState(false);
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center animate-pop">
               <h1 className="font-christmas text-5xl text-red-600 mb-2">Secret Santa</h1>
               <p className="text-gray-400 font-bold text-xs uppercase tracking-widest mb-8">Mission Assigned</p>
               {!open ? (
                 <button onClick={() => { setOpen(true); window.confetti({ particleCount: 200, spread: 80 }); }} className="w-64 h-64 rounded-full bg-red-600 shadow-2xl flex flex-col items-center justify-center text-white border-4 border-red-400 hover:scale-105 transition active:scale-95">
                   <div className="animate-bounce mb-2"><Icon name="gift"/></div>
                   <span className="font-christmas text-3xl">OPEN</span>
                 </button>
               ) : (
                 <div className="snow-card w-full max-w-sm p-8 border-t-8 border-green-500 animate-pop">
                   <p className="text-xs font-bold text-gray-400 uppercase mb-4">You are buying for</p>
                   <div className="text-5xl font-christmas text-green-900 mb-6">{myMatch.name}</div>
                   <div className="bg-green-50 p-4 rounded-xl border border-green-100 text-green-800">
                     <p className="text-xs font-bold uppercase opacity-50 mb-1">Their Hint</p>
                     "{myMatch.wish}"
                   </div>
                   <p className="text-xs text-gray-400 mt-6 italic">Screenshot this now!</p>
                 </div>
               )}
            </div>
          );
        }

        return null;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
