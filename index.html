<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa's Secret Party 🤫</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PeerJS (P2P Networking) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Mountains+of+Christmas:wght@700&display=swap');
      
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #f0fdf4;
        background-image: repeating-linear-gradient(45deg, #dcfce7 25%, transparent 25%, transparent 75%, #dcfce7 75%, #dcfce7), repeating-linear-gradient(45deg, #dcfce7 25%, #f0fdf4 25%, #f0fdf4 75%, #dcfce7 75%, #dcfce7);
        background-position: 0 0, 10px 10px;
        background-size: 20px 20px;
        color: #166534;
        min-height: 100vh;
      }
      
      .font-christmas { font-family: 'Mountains of Christmas', cursive; }
      
      .snow-card {
        background: rgba(255, 255, 255, 0.95);
        border: 4px solid #ffffff;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        border-radius: 1.5rem;
      }

      .btn-bounce:active { transform: scale(0.95); }
      .btn-bounce:hover { transform: translateY(-2px); }
      
      .animate-enter { animation: enter 0.5s ease-out; }
      @keyframes enter {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- HELPERS ---
      const generateId = () => {
        // Create a 4-letter memorable code
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let result = '';
        for (let i = 0; i < 4; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        return result;
      };

      const ADMIN_PASSCODE = "butts";

      // --- ICONS ---
      const Icons = {
        Santa: () => <svg className="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4c2.5 0 4.5 2 4.5 4.5v1.5h3.8a1 1 0 0 1 .6 1.8l-2.4 1.6v6.6a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-6.6l-2.4-1.6a1 1 0 0 1 .6-1.8h3.8v-1.5c0-2.5 2-4.5 4.5-4.5h4z"/><path d="M12 4v2"/><path d="M12 12v3"/><path d="M12 17v2"/></svg>,
        Users: () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
        Copy: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
        Gift: () => <svg className="w-16 h-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      };

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('LANDING'); // LANDING, ADMIN_LOGIN, HOST_LOBBY, GUEST_JOIN, GUEST_LOBBY, GUEST_REVEAL
        
        // Host State
        const [roomCode, setRoomCode] = useState("");
        const [peer, setPeer] = useState(null);
        const [players, setPlayers] = useState([]); // { id, name, wish }
        const [conns, setConns] = useState([]);
        const [passcode, setPasscode] = useState("");

        // Guest State
        const [myName, setMyName] = useState("");
        const [myWish, setMyWish] = useState("");
        const [myMatch, setMyMatch] = useState(null);

        // 1. Check URL on Load
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const room = params.get('room');
          if (room) {
            setRoomCode(room.toUpperCase());
            setView('GUEST_JOIN');
          }
        }, []);

        // --- HOST ACTIONS ---
        const verifyAdmin = (e) => {
          e.preventDefault();
          if (passcode.toLowerCase() === ADMIN_PASSCODE) {
            startHosting();
          } else {
            alert("Wrong passcode! Are you really Santa?");
          }
        };

        const startHosting = () => {
          const code = generateId();
          setRoomCode(code);
          setView('HOST_LOBBY');

          // Initialize P2P
          const p = new Peer(code, { debug: 1 });
          
          p.on('open', (id) => { console.log("Host Open:", id); });
          
          p.on('connection', (conn) => {
            conn.on('open', () => {
              // Add connection
              setConns(prev => [...prev, conn]);
              
              conn.on('data', (data) => {
                if (data.type === 'JOIN') {
                  setPlayers(prev => {
                    // Prevent duplicates
                    if (prev.find(p => p.id === conn.peer)) return prev;
                    return [...prev, { id: conn.peer, name: data.name, wish: data.wish }];
                  });
                }
              });

              conn.on('close', () => {
                setPlayers(prev => prev.filter(p => p.id !== conn.peer));
              });
            });
          });

          setPeer(p);
        };

        const shuffle = () => {
          if (players.length < 2) return alert("Need at least 2 elves to play!");
          
          let shuffled = [...players];
          let valid = false;
          // Derangement shuffle
          for(let k=0; k<100; k++) {
            for(let i=shuffled.length-1; i>0; i--) {
              const j = Math.floor(Math.random()*(i+1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
            if (valid) break;
          }

          if(!valid) return alert("Shuffle failed. Add more people!");

          // Send data
          players.forEach((p, i) => {
            const target = shuffled[i];
            const conn = conns.find(c => c.peer === p.id);
            if(conn) {
              conn.send({ type: 'REVEAL', targetName: target.name, targetWish: target.wish });
            }
          });

          alert("Sent! Everyone check your phones!");
        };

        const copyLink = () => {
          const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
          navigator.clipboard.writeText(url);
          alert("Link copied! Send it to the group chat.");
        };

        // --- GUEST ACTIONS ---
        const joinParty = (e) => {
          e.preventDefault();
          if (!myName || !myWish) return alert("Please fill in all fields!");
          
          setView('GUEST_LOBBY');
          
          const p = new Peer(null, { debug: 1 });
          
          p.on('open', (id) => {
            const conn = p.connect(roomCode);
            
            conn.on('open', () => {
              conn.send({ type: 'JOIN', name: myName, wish: myWish });
            });

            conn.on('data', (data) => {
              if (data.type === 'REVEAL') {
                setMyMatch({ name: data.targetName, wish: data.targetWish });
                setView('GUEST_REVEAL');
                window.confetti({ particleCount: 200, spread: 70 });
              }
            });

            conn.on('error', (err) => {
              alert("Connection failed. Is the Host page still open?");
              setView('GUEST_JOIN');
            });
          });
          
          p.on('error', (err) => {
             alert("Could not connect to room " + roomCode);
             setView('GUEST_JOIN');
          });
        };

        // --- VIEWS ---

        // 1. Landing
        if (view === 'LANDING') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="snow-card w-full max-w-sm p-8 text-center space-y-6 animate-enter">
                <div className="text-red-500 mx-auto flex justify-center"><Icons.Santa /></div>
                <h1 className="font-christmas text-5xl text-green-800">Secret Santa</h1>
                <p className="text-green-600 text-sm">Real-time party mode</p>
                
                <button 
                  onClick={() => setView('ADMIN_LOGIN')}
                  className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg btn-bounce transition"
                >
                  Create New Party
                </button>
                <button 
                  onClick={() => setView('GUEST_JOIN')}
                  className="w-full bg-white text-green-700 font-bold py-4 rounded-xl border-2 border-green-200 hover:bg-green-50 btn-bounce transition"
                >
                  Join Existing
                </button>
              </div>
            </div>
          );
        }

        // 2. Admin Login
        if (view === 'ADMIN_LOGIN') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="snow-card w-full max-w-sm p-8 text-center animate-enter">
                <h2 className="font-christmas text-4xl mb-4 text-green-800">Admin Access</h2>
                <form onSubmit={verifyAdmin} className="space-y-4">
                  <input 
                    type="password"
                    value={passcode}
                    onChange={e => setPasscode(e.target.value)}
                    placeholder="Enter Passcode"
                    className="w-full p-3 rounded-lg border-2 border-green-200 text-center outline-none focus:border-red-400"
                    autoFocus
                  />
                  <button className="w-full bg-green-600 text-white py-3 rounded-xl font-bold btn-bounce">
                    Unlock Party
                  </button>
                </form>
                <button onClick={() => setView('LANDING')} className="text-xs text-gray-400 mt-4 underline">Cancel</button>
              </div>
            </div>
          );
        }

        // 3. Host Lobby
        if (view === 'HOST_LOBBY') {
          return (
            <div className="min-h-screen p-4 pb-32 max-w-lg mx-auto">
              <div className="text-center pt-8 mb-6 animate-enter">
                <div className="inline-block bg-yellow-100 text-yellow-800 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider border border-yellow-300 mb-2">
                  Room: {roomCode}
                </div>
                <h1 className="font-christmas text-5xl text-green-900">The Party List</h1>
                <p className="text-green-600 text-sm mb-4">Keep this page open!</p>
                
                <button onClick={copyLink} className="bg-white border-2 border-green-200 text-green-700 px-6 py-3 rounded-xl font-bold flex items-center gap-2 mx-auto hover:bg-green-50 btn-bounce">
                  <Icons.Copy /> Copy Invite Link
                </button>
              </div>

              <div className="space-y-3">
                <div className="flex justify-between px-2 text-xs font-bold text-green-800 uppercase">
                  <span>Joined ({players.length})</span>
                  {players.length === 0 && <span className="text-red-400 animate-pulse">Waiting...</span>}
                </div>
                
                {players.map(p => (
                  <div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex justify-between items-center animate-enter">
                    <div>
                      <div className="font-bold text-gray-800">{p.name}</div>
                      <div className="text-xs text-gray-500 italic">{p.wish}</div>
                    </div>
                    <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                  </div>
                ))}
              </div>

              {players.length > 1 && (
                <div className="fixed bottom-6 left-4 right-4 max-w-lg mx-auto">
                  <button 
                    onClick={shuffle}
                    className="w-full bg-red-600 text-white font-christmas text-2xl py-4 rounded-2xl shadow-xl btn-bounce flex items-center justify-center gap-2"
                  >
                    Shuffle & Send! 🚀
                  </button>
                </div>
              )}
            </div>
          );
        }

        // 4. Guest Join
        if (view === 'GUEST_JOIN') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="snow-card w-full max-w-sm p-8 animate-enter">
                <div className="text-center mb-6">
                  <div className="inline-block bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-bold mb-2">ROOM {roomCode || "?"}</div>
                  <h1 className="font-christmas text-4xl text-green-800">Join Party</h1>
                </div>
                
                {!roomCode ? (
                  <div className="text-center">
                    <input 
                       value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())}
                       placeholder="Enter Room Code"
                       className="w-full text-center p-3 border-2 border-red-100 rounded-lg mb-4 uppercase font-bold tracking-widest"
                       maxLength={4}
                    />
                  </div>
                ) : null}

                <form onSubmit={joinParty} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-gray-400 uppercase">Your Name</label>
                    <input 
                      value={myName} onChange={e => setMyName(e.target.value)}
                      className="w-full p-3 border-2 border-green-100 rounded-lg outline-none focus:border-green-400 font-bold"
                      placeholder="e.g. Elf Buddy"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-400 uppercase">Weird Fact / Wish</label>
                    <input 
                      value={myWish} onChange={e => setMyWish(e.target.value)}
                      className="w-full p-3 border-2 border-green-100 rounded-lg outline-none focus:border-green-400"
                      placeholder="e.g. I love socks"
                    />
                  </div>
                  <button className="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg btn-bounce">
                    Join Now
                  </button>
                </form>
              </div>
            </div>
          );
        }

        // 5. Guest Lobby
        if (view === 'GUEST_LOBBY') {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center animate-enter">
              <div className="text-6xl animate-bounce mb-6">⏳</div>
              <h2 className="font-christmas text-5xl text-green-900 mb-2">You're In!</h2>
              <p className="text-green-700 font-medium">Waiting for the host to start...</p>
              <div className="mt-8 p-4 bg-yellow-50 border border-yellow-200 rounded-xl text-yellow-800 text-sm max-w-xs">
                ⚠️ Don't close this window or you'll leave the circle!
              </div>
            </div>
          );
        }

        // 6. Reveal
        if (view === 'GUEST_REVEAL') {
          const [isOpen, setIsOpen] = useState(false);
          
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center animate-enter">
              <h1 className="font-christmas text-5xl text-red-600 mb-2">Secret Santa</h1>
              <p className="text-gray-400 uppercase text-xs font-bold tracking-widest mb-10">Mission Received</p>

              {!isOpen ? (
                <button 
                  onClick={() => { setIsOpen(true); window.confetti({ particleCount: 200, spread: 80 }); }}
                  className="group relative w-64 h-64 rounded-full bg-gradient-to-br from-red-500 to-red-700 shadow-[0_15px_30px_rgba(220,38,38,0.4)] flex flex-col items-center justify-center text-white cursor-pointer btn-bounce border-4 border-white"
                >
                  <div className="animate-bounce mb-2"><Icons.Gift /></div>
                  <span className="font-christmas text-3xl">OPEN ME</span>
                </button>
              ) : (
                <div className="snow-card w-full max-w-sm p-8 border-t-8 border-green-500 animate-enter">
                  <p className="text-xs font-bold text-gray-400 uppercase mb-4">You are getting a gift for</p>
                  <div className="text-5xl font-christmas text-green-900 mb-6">{myMatch.name}</div>
                  <div className="bg-green-50 p-6 rounded-xl text-green-800 border border-green-100">
                    <p className="text-xs uppercase font-bold opacity-50 mb-1">Their Hint</p>
                    <p className="text-lg font-medium">"{myMatch.wish}"</p>
                  </div>
                  <p className="text-xs text-gray-400 mt-6 italic">Take a screenshot now!</p>
                </div>
              )}
            </div>
          );
        }

        return null;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
