<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Santa's Mega Party 🎄</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@500;700&display=swap');
      
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #fff1f2;
        color: #881337;
        min-height: 100vh;
        overflow: hidden; /* App handles scrolling */
        touch-action: manipulation; /* Improves touch response */
      }
      
      .font-fun { font-family: 'Chewy', cursive; }
      
      .cute-card {
        background: white;
        border: 4px solid #fecdd3;
        box-shadow: 8px 8px 0px #fb7185;
        border-radius: 2rem;
      }
      
      /* Big, easy-to-tap button */
      .btn-mega {
        background: #f43f5e;
        color: white;
        font-family: 'Chewy', cursive;
        font-size: 1.5rem;
        padding: 1.25rem;
        border-radius: 1.5rem;
        border: 2px solid white;
        box-shadow: 0 6px 0 #9f1239;
        transition: all 0.1s;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .btn-mega:active { transform: translateY(6px); box-shadow: none; }
      .btn-mega:disabled { 
        background: #e5e7eb; 
        color: #9ca3af; 
        box-shadow: none; 
        border-color: #f3f4f6;
        cursor: not-allowed; 
        transform: none; 
      }

      .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* Host List Scroller */
      .scroller {
        -webkit-overflow-scrolling: touch;
      }
      .scroller::-webkit-scrollbar { width: 6px; }
      .scroller::-webkit-scrollbar-track { background: #fff1f2; }
      .scroller::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- HELPERS ---
      const randomCode = () => {
        const adjs = ['JOY', 'HOLLY', 'SNOW', 'GIFT', 'STAR'];
        const nums = Math.floor(Math.random() * 90 + 10);
        return adjs[Math.floor(Math.random()*adjs.length)] + "-" + nums;
      };

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('LOADING'); 
        
        // Host State
        const [roomCode, setRoomCode] = useState("");
        const [players, setPlayers] = useState([]);
        const [hostStatus, setHostStatus] = useState("Offline");
        
        // Guest State
        const [guestName, setGuestName] = useState("");
        const [guestWish, setGuestWish] = useState("");
        const [myMatch, setMyMatch] = useState(null);
        
        // Refs
        const peerRef = useRef(null);
        const connsRef = useRef([]);

        // 1. INITIALIZATION
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const urlParty = params.get('party');
          const savedHost = localStorage.getItem('santa_host_code');

          if (urlParty) {
            setRoomCode(urlParty);
            setView('GUEST_JOIN');
          } else if (savedHost) {
            initHost(savedHost);
          } else {
            setView('HOME');
          }
        }, []);

        // --- HOST LOGIC ---
        const initHost = (codeToUse) => {
          const code = codeToUse || randomCode();
          setRoomCode(code);
          localStorage.setItem('santa_host_code', code);
          setView('HOST_LOBBY');
          setHostStatus("Connecting...");

          if (peerRef.current) peerRef.current.destroy();

          const peer = new Peer(code.replace('-', ''), { debug: 1 });
          peerRef.current = peer;

          peer.on('open', (id) => {
            console.log("Host Online:", id);
            setHostStatus("Online");
          });

          peer.on('connection', (conn) => {
            conn.on('open', () => {
              connsRef.current.push(conn);
              conn.send({ type: 'HELLO' });

              conn.on('data', (data) => {
                if (data.type === 'JOIN') {
                  setPlayers(prev => {
                    const filtered = prev.filter(p => p.id !== conn.peer);
                    return [...filtered, { id: conn.peer, name: data.name, wish: data.wish }];
                  });
                  conn.send({ type: 'ACK' });
                }
              });

              conn.on('close', () => {
                setPlayers(prev => prev.filter(p => p.id !== conn.peer));
                connsRef.current = connsRef.current.filter(c => c.peer !== conn.peer);
              });
            });
          });

          peer.on('error', (err) => {
            if (err.type === 'unavailable-id') setTimeout(() => initHost(code), 1000); 
          });
          
          peer.on('disconnected', () => peer.reconnect());
        };

        const resetHost = () => {
          if(confirm("End the party? This disconnects everyone.")) {
            localStorage.removeItem('santa_host_code');
            if (peerRef.current) peerRef.current.destroy();
            window.location.href = window.location.pathname; 
          }
        };

        const shuffleAndSend = () => {
          if (players.length < 2) return alert("Need 2+ people!");
          
          let shuffled = [...players];
          let valid = false;
          
          for(let k=0; k<100; k++) {
            for(let i=shuffled.length-1; i>0; i--) {
              const j = Math.floor(Math.random()*(i+1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
            if(valid) break;
          }

          if(!valid) return alert("Shuffle failed. Add more people!");

          players.forEach((p, i) => {
            const match = shuffled[i];
            const conn = connsRef.current.find(c => c.peer === p.id);
            if(conn) conn.send({ type: 'MATCH', name: match.name, wish: match.wish });
          });
          alert("Sent! 🎁");
        };

        // --- GUEST LOGIC ---
        const joinParty = (e) => {
          e.preventDefault();
          if(!guestName || !guestWish) return alert("Fill in the blanks!");
          setView('GUEST_WAITING');
          const peer = new Peer(null, { debug: 1 });
          peerRef.current = peer;
          peer.on('open', () => connectToHost(peer));
        };

        const connectToHost = (peer) => {
          const hostId = roomCode.replace('-', '');
          const conn = peer.connect(hostId);
          conn.on('data', (data) => {
            if (data.type === 'HELLO') conn.send({ type: 'JOIN', name: guestName, wish: guestWish });
            if (data.type === 'MATCH') {
              setMyMatch(data);
              setView('GUEST_REVEAL');
            }
          });
          conn.on('close', () => alert("Host disconnected!"));
          conn.on('error', () => setTimeout(() => connectToHost(peer), 2000));
        };

        // --- VIEWS ---

        if (view === 'LOADING') return <div className="h-screen flex items-center justify-center text-2xl font-fun text-pink-500 animate-bounce">Loading...</div>;

        // 1. HOME
        if (view === 'HOME') {
          return (
            <div className="h-screen flex items-center justify-center p-4">
              <div className="cute-card w-full max-w-sm p-8 text-center space-y-8 animate-pop">
                <div className="text-6xl animate-float">🎅</div>
                <h1 className="font-fun text-5xl text-pink-600">Secret Santa</h1>
                <button onClick={() => initHost(null)} className="btn-mega w-full bg-red-500">Start Party</button>
                <div className="relative py-2 text-center text-xs text-pink-300 font-bold">OR JOIN</div>
                <form onSubmit={(e) => { e.preventDefault(); setView('GUEST_JOIN'); }} className="flex gap-2">
                  <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-24 text-center border-2 border-pink-200 rounded-xl outline-none font-bold text-pink-500 p-2" />
                  <button className="flex-1 bg-white border-2 border-pink-400 text-pink-500 font-bold rounded-xl">Join</button>
                </form>
              </div>
            </div>
          );
        }

        // 2. HOST LOBBY (FIXED LAYOUT)
        if (view === 'HOST_LOBBY') {
          const shareUrl = `${window.location.origin}${window.location.pathname}?party=${roomCode}`;
          return (
            <div className="fixed inset-0 flex flex-col bg-white">
              
              {/* Header */}
              <div className="pt-6 pb-2 px-4 text-center bg-pink-50 border-b-2 border-pink-100 shadow-sm z-10">
                <div className="inline-block bg-yellow-300 text-yellow-900 px-4 py-1 rounded-full font-fun text-xl transform -rotate-1 shadow-sm mb-2">
                  Code: {roomCode}
                </div>
                <div className="flex gap-2 justify-center">
                  <button onClick={() => { navigator.clipboard.writeText(shareUrl); alert("Copied!"); }} className="bg-white text-pink-600 px-4 py-2 rounded-xl border-2 border-pink-200 font-bold text-xs shadow-sm active:scale-95">
                    🔗 Copy Link
                  </button>
                  <button onClick={resetHost} className="bg-white text-red-400 px-4 py-2 rounded-xl border-2 border-red-100 font-bold text-xs shadow-sm active:scale-95">
                    ❌ End
                  </button>
                </div>
              </div>

              {/* Scrollable List */}
              <div className="flex-1 overflow-y-auto scroller p-4 bg-white">
                <h3 className="font-bold text-pink-800 mb-3 px-2">Elves: {players.length}</h3>
                <div className="space-y-3 pb-24">
                  {players.map(p => (
                    <div key={p.id} className="bg-white border-2 border-green-200 p-4 rounded-2xl flex items-center justify-between shadow-sm animate-pop">
                      <div className="overflow-hidden">
                        <div className="font-bold text-green-800 text-lg truncate">{p.name}</div>
                        <div className="text-xs text-green-600 font-medium truncate">"{p.wish}"</div>
                      </div>
                      <div className="text-2xl shrink-0">🧝</div>
                    </div>
                  ))}
                  {players.length === 0 && (
                    <div className="text-center py-10 text-pink-300 font-bold animate-pulse">Waiting for family...</div>
                  )}
                </div>
              </div>

              {/* Sticky Footer Button */}
              <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t border-pink-100 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
                <div className="max-w-lg mx-auto">
                  <button onClick={shuffleAndSend} disabled={players.length < 2} className="btn-mega w-full bg-green-500 hover:bg-green-600 shadow-[0_6px_0_#15803d]">
                    {players.length < 2 ? "Waiting..." : "SHUFFLE & SEND! 🚀"}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // 3. GUEST JOIN
        if (view === 'GUEST_JOIN') {
          return (
            <div className="h-screen flex items-center justify-center p-4">
              <div className="cute-card w-full max-w-sm p-8 animate-pop">
                <div className="text-center mb-6">
                  <span className="bg-yellow-200 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold">ROOM: {roomCode}</span>
                  <h1 className="font-fun text-4xl text-pink-600 mt-2">Join In!</h1>
                </div>
                {!roomCode && <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-full text-center p-3 border-2 border-pink-200 rounded-xl mb-4 font-bold" />}
                <form onSubmit={joinParty} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-pink-400 uppercase ml-1">Your Name</label>
                    <input value={guestName} onChange={e => setGuestName(e.target.value)} className="w-full p-4 border-2 border-pink-200 rounded-xl outline-none focus:border-pink-500 font-bold text-lg text-pink-600" placeholder="e.g. Grandma" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-pink-400 uppercase ml-1">Wishlist 🎁</label>
                    <input value={guestWish} onChange={e => setGuestWish(e.target.value)} className="w-full p-4 border-2 border-pink-200 rounded-xl outline-none focus:border-pink-500 text-pink-600" placeholder="e.g. Socks" />
                  </div>
                  <button className="btn-mega w-full bg-pink-500 mt-4">I'm Ready!</button>
                </form>
              </div>
            </div>
          );
        }

        // 4. WAITING
        if (view === 'GUEST_WAITING') {
          return (
            <div className="h-screen flex flex-col items-center justify-center p-6 text-center animate-pop bg-green-50">
              <div className="text-6xl animate-bounce mb-6">🎄</div>
              <h2 className="font-fun text-4xl text-pink-600 mb-2">You're In!</h2>
              <p className="text-pink-800 font-bold text-lg">Waiting for Santa...</p>
              <div className="mt-8 bg-white p-4 rounded-xl border-2 border-pink-100 text-sm text-pink-400 max-w-xs shadow-sm">
                Don't close your phone! Wait for the host to press the button.
              </div>
            </div>
          );
        }

        // 5. REVEAL (WITH COUNTDOWN)
        if (view === 'GUEST_REVEAL') {
          const [step, setStep] = useState('CLOSED'); // CLOSED, COUNTDOWN, OPEN
          const [count, setCount] = useState(3);

          const startReveal = () => {
            setStep('COUNTDOWN');
            let c = 3;
            const timer = setInterval(() => {
              c--;
              setCount(c);
              if (c === 0) {
                clearInterval(timer);
                setStep('OPEN');
                window.confetti({ particleCount: 500, spread: 120, startVelocity: 40 });
              }
            }, 1000);
          };

          if (step === 'COUNTDOWN') {
            return (
              <div className="h-screen flex items-center justify-center bg-red-500">
                <h1 className="font-fun text-[10rem] text-white animate-pulse">{count}</h1>
              </div>
            );
          }

          if (step === 'OPEN') {
            return (
              <div className="h-screen flex flex-col items-center justify-center p-4 bg-green-50 animate-pop text-center">
                <p className="text-sm font-bold text-gray-400 uppercase tracking-widest mb-6">You are buying for</p>
                <div className="text-6xl font-fun text-red-600 mb-8 drop-shadow-sm">{myMatch.name}</div>
                <div className="bg-white p-8 rounded-3xl border-4 border-red-200 text-green-800 shadow-xl w-full max-w-sm transform rotate-1">
                  <p className="text-xs font-bold uppercase opacity-50 mb-2">They asked for</p>
                  <p className="text-2xl font-bold font-fun">"{myMatch.wish}"</p>
                </div>
                <p className="text-xs text-gray-400 mt-8 font-bold animate-pulse">📸 Screenshot this!</p>
              </div>
            );
          }

          // Initial CLOSED State
          return (
            <div className="h-screen flex flex-col items-center justify-center p-4 text-center">
              <h1 className="font-fun text-5xl text-red-600 mb-2">Secret Santa</h1>
              <p className="text-pink-400 font-bold uppercase tracking-widest mb-8">You have a match!</p>
              <button onClick={startReveal} className="w-72 h-72 rounded-full bg-red-500 shadow-[0_10px_0_#9f1239] flex flex-col items-center justify-center text-white border-8 border-white hover:scale-105 transition active:translate-y-2 active:shadow-none cursor-pointer">
                <div className="text-7xl animate-bounce mb-2">🎁</div>
                <span className="font-fun text-4xl">OPEN ME!</span>
              </button>
            </div>
          );
        }

        return null;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
