<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Santa Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@300;400;600&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .font-christmas { font-family: 'Mountains of Christmas', cursive; }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Icons
      const Icon = ({ name, size = 24 }) => {
        const icons = {
          gift: <path d="M20 12v10H4V12M2 7h20v5H2zm10 0V4a3 3 0 0 0-3-3 3 3 0 0 0-3 3v3m6 0V4a3 3 0 0 1 3-3 3 3 0 0 1 3 3v3m-6 0h6m-6 10h6" />,
          wand: <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72ZM14 7l3 3M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9" />,
          users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>,
          check: <polyline points="20 6 9 17 4 12" />,
          copy: <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />,
          trash: <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
        };
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
      };

      // Encoding Logic
      const encodeData = (data) => btoa(encodeURIComponent(JSON.stringify(data)));
      const decodeData = (str) => {
        try { return JSON.parse(decodeURIComponent(atob(str))); } catch (e) { return null; }
      };
      const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9]/g, "");

      // Components
      const AdminDashboard = ({ onGenerate }) => {
        const [mode, setMode] = useState('SINGLE');
        const [participants, setParticipants] = useState([]);
        const [name, setName] = useState("");
        const [bulkText, setBulkText] = useState("");

        useEffect(() => {
          const draft = localStorage.getItem('santa_project_draft');
          if (draft) setParticipants(JSON.parse(draft));
        }, []);
        useEffect(() => localStorage.setItem('santa_project_draft', JSON.stringify(participants)), [participants]);

        const addSingle = (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          setParticipants([...participants, { id: crypto.randomUUID(), name: name.trim(), interests: "Surprise me!" }]);
          setName("");
        };
        const processBulk = () => {
          const lines = bulkText.split('\n').filter(l => l.trim());
          setParticipants([...participants, ...lines.map(l => ({ id: crypto.randomUUID(), name: l.trim(), interests: "Surprise me!" }))]);
          setBulkText(""); setMode('SINGLE');
        };
        const generateProject = () => {
          if (participants.length < 2) { alert("Need at least 2 people!"); return; }
          let shuffled = [...participants], valid = false;
          for (let k = 0; k < 100; k++) {
            for (let i = shuffled.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for (let i = 0; i < participants.length; i++) if (participants[i].id === shuffled[i].id) { valid = false; break; }
            if (valid) break;
          }
          if (!valid) { alert("Shuffle failed. Add more people."); return; }
          onGenerate({ participants, pairings: participants.map((p, i) => ({ santaId: p.id, targetId: shuffled[i].id })) });
        };

        return (
          <div className="min-h-screen p-4 pb-32 max-w-2xl mx-auto animate-slide-up">
            <div className="text-center mb-8 pt-8">
              <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600"><Icon name="users" size={40} /></div>
              <h1 className="font-christmas text-5xl text-gray-800">New Project</h1>
            </div>
            <div className="glass-card p-6 rounded-2xl mb-6">
              <div className="flex gap-4 mb-4 border-b border-gray-200 pb-2">
                <button onClick={() => setMode('SINGLE')} className={`text-sm font-bold pb-2 ${mode==='SINGLE'?'text-red-600 border-b-2 border-red-600':'text-gray-400'}`}>Add One</button>
                <button onClick={() => setMode('BULK')} className={`text-sm font-bold pb-2 ${mode==='BULK'?'text-red-600 border-b-2 border-red-600':'text-gray-400'}`}>Bulk Paste</button>
              </div>
              {mode === 'SINGLE' ? (
                <form onSubmit={addSingle} className="flex gap-2">
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="Enter Name" className="flex-1 p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none" autoFocus />
                  <button className="bg-gray-800 text-white px-6 rounded-lg font-bold hover:bg-gray-700">Add</button>
                </form>
              ) : (
                <div className="space-y-2">
                  <textarea value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="Paste names here (one per line)..." className="w-full p-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none h-32" />
                  <button onClick={processBulk} className="w-full bg-gray-800 text-white py-2 rounded-lg font-bold hover:bg-gray-700">Add All</button>
                </div>
              )}
            </div>
            <div className="space-y-2">
              <h3 className="font-bold text-gray-400 text-xs uppercase px-2">Roster ({participants.length})</h3>
              {participants.map(p => (
                <div key={p.id} className="bg-white p-3 px-4 rounded-xl shadow-sm flex justify-between items-center">
                  <span className="font-bold text-gray-800">{p.name}</span>
                  <button onClick={() => setParticipants(participants.filter(x => x.id !== p.id))} className="text-red-300 hover:text-red-600"><Icon name="trash" size={18} /></button>
                </div>
              ))}
            </div>
            {participants.length > 1 && (
              <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t z-50">
                <div className="max-w-2xl mx-auto"><button onClick={generateProject} className="w-full bg-green-600 text-white font-bold text-xl py-4 rounded-xl shadow-xl hover:bg-green-700 flex items-center justify-center gap-2"><Icon name="wand" /> Confirm & Create Link</button></div>
              </div>
            )}
          </div>
        );
      };

      const SuccessScreen = ({ data }) => {
        const [copied, setCopied] = useState(false);
        const url = `${window.location.origin}${window.location.pathname}?project=${encodeData(data)}`;
        const copy = () => { navigator.clipboard.writeText(url); setCopied(true); setTimeout(() => setCopied(false), 2000); };
        return (
          <div className="min-h-screen flex items-center justify-center p-6 animate-slide-up">
            <div className="glass-card w-full max-w-md p-8 rounded-3xl text-center">
              <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600 animate-bounce"><Icon name="check" size={40} /></div>
              <h1 className="font-christmas text-4xl text-gray-800 mb-2">Project Created!</h1>
              <p className="text-gray-500 mb-6">Send this link to the group.</p>
              <div className="bg-gray-100 p-4 rounded-lg break-all text-xs font-mono text-gray-500 mb-6 border border-gray-200 max-h-32 overflow-y-auto">{url}</div>
              <button onClick={copy} className={`w-full py-4 rounded-xl font-bold text-white shadow-lg transition flex items-center justify-center gap-2 ${copied ? 'bg-green-600' : 'bg-red-600 hover:bg-red-700'}`}>{copied ? <Icon name="check" /> : <Icon name="copy" />}{copied ? "Link Copied!" : "Copy Project Link"}</button>
              <button onClick={() => window.location.href = window.location.pathname} className="mt-6 text-sm text-gray-400 hover:text-red-500 underline">Create New Project</button>
            </div>
          </div>
        );
      };

      const RevealScreen = ({ data }) => {
        const [input, setInput] = useState("");
        const [currentUser, setCurrentUser] = useState(null);
        const [target, setTarget] = useState(null);
        const [revealed, setRevealed] = useState(false);

        const handleLogin = (e) => {
          e.preventDefault();
          const found = data.participants.find(p => normalize(p.name) === normalize(input));
          if (found) {
            setCurrentUser(found);
            const pair = data.pairings.find(p => p.santaId === found.id);
            if (pair) setTarget(data.participants.find(p => p.id === pair.targetId));
          } else alert("Name not found!");
        };

        if (!currentUser) return (
          <div className="min-h-screen flex items-center justify-center p-6 animate-slide-up">
            <div className="glass-card w-full max-w-md p-8 rounded-3xl text-center">
              <div className="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6 text-red-600"><Icon name="users" size={40} /></div>
              <h1 className="font-christmas text-4xl text-gray-800 mb-2">Who are you?</h1>
              <form onSubmit={handleLogin} className="space-y-4">
                <input value={input} onChange={e => setInput(e.target.value)} className="w-full text-center text-xl p-4 rounded-xl border-2 border-red-100 focus:border-red-500 outline-none bg-white/50" placeholder="Your Name" autoFocus />
                <button className="w-full bg-red-600 text-white font-bold py-4 rounded-xl hover:bg-red-700 shadow-lg">Find Me</button>
              </form>
            </div>
          </div>
        );

        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center animate-slide-up">
            <h1 className="font-christmas text-5xl text-red-600 mb-2">Secret Santa</h1>
            <p className="text-gray-500 uppercase text-xs font-bold tracking-widest mb-10">Mission for: {currentUser.name}</p>
            {!revealed ? (
              <button onClick={() => { setRevealed(true); window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); }} className="group relative w-64 h-64 rounded-full bg-gradient-to-br from-red-500 to-red-700 shadow-[0_20px_50px_rgba(220,38,38,0.5)] flex flex-col items-center justify-center text-white transition transform hover:scale-105 active:scale-95 cursor-pointer">
                <div className="mb-4 group-hover:rotate-12 transition duration-300"><Icon name="gift" size={64} /></div>
                <span className="font-bold text-2xl">TAP TO REVEAL</span>
              </button>
            ) : (
              <div className="glass-card w-full max-w-sm p-8 rounded-3xl animate-slide-up border-t-8 border-green-500">
                <p className="text-xs font-bold text-gray-400 uppercase mb-4">You are buying a gift for</p>
                <div className="text-4xl font-bold text-gray-800 mb-6">{target?.name}</div>
                <div className="bg-green-50 p-6 rounded-xl text-green-800 border border-green-100"><p className="text-sm">Please keep it a secret! 🤫</p></div>
                <p className="text-xs text-gray-400 mt-6 italic">Take a screenshot now so you don't forget!</p>
              </div>
            )}
          </div>
        );
      };

      const App = () => {
        const [projectData, setProjectData] = useState(null);
        const [generatedData, setGeneratedData] = useState(null);
        useEffect(() => {
          const raw = new URLSearchParams(window.location.search).get('project');
          if (raw) setProjectData(decodeData(raw));
        }, []);
        if (projectData) return <RevealScreen data={projectData} />;
        if (generatedData) return <SuccessScreen data={generatedData} />;
        return <AdminDashboard onGenerate={setGeneratedData} />;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
