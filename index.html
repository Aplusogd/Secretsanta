<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Santa's Christmas Party 🎄</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chewy&family=Quicksand:wght@500;700&display=swap');
      
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f0fdf4; /* Mint */
        background-image: repeating-linear-gradient(45deg, #dcfce7 25%, transparent 25%, transparent 75%, #dcfce7 75%, #dcfce7), repeating-linear-gradient(45deg, #dcfce7 25%, #f0fdf4 25%, #f0fdf4 75%, #dcfce7 75%, #dcfce7);
        background-position: 0 0, 20px 20px;
        background-size: 40px 40px;
        color: #14532d;
        min-height: 100vh;
        overflow: hidden;
      }
      
      .font-fun { font-family: 'Chewy', cursive; }
      
      .snow-card {
        background: rgba(255, 255, 255, 0.95);
        border: 4px solid #ffffff;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border-radius: 2rem;
      }

      .btn-christmas {
        background: linear-gradient(to bottom, #ef4444, #dc2626);
        color: white;
        font-family: 'Chewy', cursive;
        font-size: 1.5rem;
        padding: 1rem;
        border-radius: 1.5rem;
        border: 4px solid #fecaca;
        box-shadow: 0 6px 0 #991b1b;
        transition: all 0.1s;
        width: 100%;
        text-shadow: 1px 1px 0 #991b1b;
      }
      .btn-christmas:active { transform: translateY(6px); box-shadow: none; }
      .btn-christmas:disabled { background: #d1d5db; border-color: #e5e7eb; box-shadow: none; cursor: not-allowed; }

      /* Gift Shake Animation */
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      .shake-gift { animation: shake 0.5s; animation-iteration-count: infinite; }

      .animate-float { animation: float 3s ease-in-out infinite; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
      
      .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      .scroller { -webkit-overflow-scrolling: touch; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- HELPERS ---
      const randomCode = () => {
        const adjs = ['JOY', 'SNOW', 'GIFT', 'STAR', 'NOEL'];
        const nums = Math.floor(Math.random() * 90 + 10);
        return adjs[Math.floor(Math.random()*adjs.length)] + "-" + nums;
      };

      // --- MAIN APP ---
      const App = () => {
        const [view, setView] = useState('HOME'); // HOME, HOST_LOBBY, GUEST_JOIN, GUEST_WAITING, GUEST_REVEAL
        
        // Host Data
        const [roomCode, setRoomCode] = useState("");
        const [players, setPlayers] = useState([]);
        const [hostStatus, setHostStatus] = useState("Offline");
        const [isShuffling, setIsShuffling] = useState(false);
        
        // Guest Data
        const [guestName, setGuestName] = useState("");
        const [guestWish, setGuestWish] = useState("");
        const [myMatch, setMyMatch] = useState(null);
        
        const peerRef = useRef(null);
        const connsRef = useRef([]);

        // 1. STARTUP LOGIC
        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const partyCode = params.get('party');
          
          // Check Local Storage for restoration
          const savedMatch = localStorage.getItem('santa_match');
          const savedHost = localStorage.getItem('santa_host_code');

          if (savedMatch) {
            setMyMatch(JSON.parse(savedMatch));
            setView('GUEST_REVEAL');
          } else if (partyCode) {
            setRoomCode(partyCode);
            setView('GUEST_JOIN');
          } else if (savedHost) {
            initHost(savedHost);
          }
        }, []);

        // --- HOST LOGIC ---
        const initHost = (codeToUse) => {
          const code = codeToUse || randomCode();
          setRoomCode(code);
          localStorage.setItem('santa_host_code', code);
          setView('HOST_LOBBY');
          setHostStatus("Connecting...");

          if (peerRef.current) peerRef.current.destroy();

          const peer = new Peer(code.replace('-', ''), { debug: 1 });
          peerRef.current = peer;

          peer.on('open', (id) => {
            console.log("Host Open:", id);
            setHostStatus("Online");
          });

          peer.on('connection', (conn) => {
            conn.on('open', () => {
              connsRef.current.push(conn);
              conn.send({ type: 'HELLO' }); // Handshake

              conn.on('data', (data) => {
                if (data.type === 'JOIN') {
                  setPlayers(prev => {
                    const filtered = prev.filter(p => p.id !== conn.peer);
                    return [...filtered, { id: conn.peer, name: data.name, wish: data.wish }];
                  });
                  conn.send({ type: 'ACK' });
                }
              });

              conn.on('close', () => {
                setPlayers(prev => prev.filter(p => p.id !== conn.peer));
                connsRef.current = connsRef.current.filter(c => c.peer !== conn.peer);
              });
            });
          });

          peer.on('error', (err) => {
             if (err.type === 'unavailable-id') setTimeout(() => initHost(code), 1000);
          });
          peer.on('disconnected', () => peer.reconnect());
        };

        const resetHost = () => {
          if(confirm("End the party?")) {
            localStorage.clear();
            if (peerRef.current) peerRef.current.destroy();
            window.location.href = window.location.pathname;
          }
        };

        const handleShufflePress = () => {
          if (players.length < 2) return alert("Need at least 2 elves!");
          
          setIsShuffling(true);
          
          // Fake Shuffle Animation Delay
          setTimeout(() => {
            performShuffleAndSend();
            setIsShuffling(false);
          }, 3000);
        };

        const performShuffleAndSend = () => {
          let shuffled = [...players];
          let valid = false;
          
          // Derangement Shuffle
          for(let k=0; k<100; k++) {
            for(let i=shuffled.length-1; i>0; i--) {
              const j = Math.floor(Math.random()*(i+1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
            if (valid) break;
          }

          if (!valid) return alert("Shuffle failed. Try again!");

          // Send to Guests
          players.forEach((p, i) => {
            const match = shuffled[i];
            const conn = connsRef.current.find(c => c.peer === p.id);
            if (conn) {
              conn.send({ type: 'MATCH', name: match.name, wish: match.wish });
            }
          });
          
          alert("🎅 Sent! Tell everyone to check their screens!");
        };

        // --- GUEST LOGIC ---
        const handleGuestJoin = (e) => {
          e.preventDefault();
          if(!guestName || !guestWish) return alert("Fill in the blanks!");
          setView('GUEST_WAITING');
          connectGuest();
        };

        const connectGuest = () => {
          if (!peerRef.current) {
            peerRef.current = new Peer(null, { debug: 1 });
            peerRef.current.on('open', () => tryConnectHost());
          } else {
            tryConnectHost();
          }
        };

        const tryConnectHost = () => {
          const hostId = roomCode.replace('-', '');
          const conn = peerRef.current.connect(hostId);
          
          conn.on('open', () => {
             // Wait for handshake
          });

          conn.on('data', (data) => {
            if (data.type === 'HELLO') {
              conn.send({ type: 'JOIN', name: guestName, wish: guestWish });
            }
            if (data.type === 'MATCH') {
              localStorage.setItem('santa_match', JSON.stringify(data));
              setMyMatch(data);
              setView('GUEST_REVEAL');
              window.confetti();
            }
          });
          
          conn.on('error', () => setTimeout(tryConnectHost, 2000));
        };

        // --- VIEWS ---

        // 1. HOME
        if (view === 'HOME') {
          return (
            <div className="h-screen flex items-center justify-center p-4">
              <div className="snow-card w-full max-w-sm p-8 text-center space-y-8 animate-pop">
                <div className="text-6xl animate-float">🎅</div>
                <h1 className="font-fun text-5xl text-red-600">Secret Santa</h1>
                <button onClick={() => initHost(null)} className="btn-christmas">Start Party</button>
                <div className="text-xs text-green-600 font-bold uppercase tracking-widest">OR JOIN</div>
                <form onSubmit={(e) => { e.preventDefault(); setView('GUEST_JOIN'); }} className="flex gap-2">
                  <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-24 text-center border-2 border-red-200 rounded-xl outline-none font-bold text-red-600 p-2" />
                  <button className="flex-1 bg-white border-2 border-red-400 text-red-500 font-bold rounded-xl">Join</button>
                </form>
              </div>
            </div>
          );
        }

        // 2. HOST LOBBY
        if (view === 'HOST_LOBBY') {
          const shareUrl = `${window.location.origin}${window.location.pathname}?party=${roomCode}`;
          return (
            <div className="fixed inset-0 flex flex-col bg-white">
              <div className="pt-6 pb-2 px-4 text-center bg-red-50 border-b-2 border-red-100 shadow-sm z-10">
                <div className="inline-block bg-yellow-300 text-yellow-900 px-4 py-1 rounded-full font-fun text-xl transform -rotate-1 shadow-sm mb-2">
                  Code: {roomCode}
                </div>
                <div className="flex gap-2 justify-center">
                  <button onClick={() => { navigator.clipboard.writeText(shareUrl); alert("Copied!"); }} className="bg-white text-red-600 px-4 py-2 rounded-xl border-2 border-red-200 font-bold text-xs shadow-sm active:scale-95">🔗 Copy Link</button>
                  <button onClick={resetHost} className="bg-white text-gray-400 px-4 py-2 rounded-xl border-2 border-gray-200 font-bold text-xs shadow-sm active:scale-95">❌ End</button>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto scroller p-4 bg-white">
                <h3 className="font-bold text-red-800 mb-3 px-2">Elves Joined: {players.length}</h3>
                <div className="space-y-3 pb-24">
                  {players.map(p => (
                    <div key={p.id} className="bg-white border-2 border-green-200 p-4 rounded-2xl flex items-center justify-between shadow-sm animate-pop">
                      <div className="overflow-hidden">
                        <div className="font-bold text-green-800 text-lg truncate">{p.name}</div>
                        <div className="text-xs text-green-600 font-medium truncate">"{p.wish}"</div>
                      </div>
                      <div className="text-2xl shrink-0">🧝</div>
                    </div>
                  ))}
                  {players.length === 0 && <div className="text-center py-10 text-red-300 font-bold animate-pulse">Waiting for family...</div>}
                </div>
              </div>
              <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t border-red-100 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-50">
                <div className="max-w-lg mx-auto">
                  <button onClick={handleShufflePress} disabled={players.length < 2 || isShuffling} className="btn-christmas">
                    {isShuffling ? "Shuffling..." : "SHUFFLE & SEND! 🚀"}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // 3. GUEST JOIN
        if (view === 'GUEST_JOIN') {
          return (
            <div className="h-screen flex items-center justify-center p-4">
              <div className="snow-card w-full max-w-sm p-8 animate-pop">
                <div className="text-center mb-6">
                  <span className="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold">ROOM: {roomCode}</span>
                  <h1 className="font-fun text-4xl text-green-600 mt-2">Join In!</h1>
                </div>
                {!roomCode && <input value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} placeholder="CODE" className="w-full text-center p-3 border-2 border-green-200 rounded-xl mb-4 font-bold" />}
                <form onSubmit={handleGuestJoin} className="space-y-4">
                  <div><label className="text-xs font-bold text-green-600 uppercase ml-1">My Name</label><input value={guestName} onChange={e => setGuestName(e.target.value)} className="w-full p-4 border-2 border-green-200 rounded-xl outline-none focus:border-green-500 font-bold text-lg text-green-800" placeholder="Name" /></div>
                  <div><label className="text-xs font-bold text-green-600 uppercase ml-1">Wishlist 🎁</label><input value={guestWish} onChange={e => setGuestWish(e.target.value)} className="w-full p-4 border-2 border-green-200 rounded-xl outline-none focus:border-green-500 text-green-800" placeholder="Socks, Toys..." /></div>
                  <button className="btn-christmas">I'm Ready!</button>
                </form>
              </div>
            </div>
          );
        }

        // 4. WAITING
        if (view === 'GUEST_WAITING') {
          return (
            <div className="h-screen flex flex-col items-center justify-center p-6 text-center animate-pop bg-red-50">
              <div className="text-6xl animate-bounce mb-6">🍪</div>
              <h2 className="font-fun text-4xl text-red-600 mb-2">You're In!</h2>
              <p className="text-red-800 font-bold text-lg mb-8">Waiting for Santa...</p>
              <div className="bg-white p-4 rounded-xl border-2 border-red-100 text-sm text-red-400 max-w-xs shadow-sm">
                If your phone went to sleep, click below to check for matches.
              </div>
              <button onClick={connectGuest} className="mt-4 text-red-600 font-bold underline">Check for Mail 🔄</button>
            </div>
          );
        }

        // 5. REVEAL (THE CHRISTMAS MIRACLE)
        if (view === 'GUEST_REVEAL') {
          const [phase, setPhase] = useState('BOX'); // BOX, COUNTDOWN, CARD
          const [count, setCount] = useState(3);

          const openGift = () => {
            setPhase('COUNTDOWN');
            let c = 3;
            const timer = setInterval(() => {
              c--;
              setCount(c);
              if (c === 0) {
                clearInterval(timer);
                setPhase('CARD');
                window.confetti({ particleCount: 500, spread: 150, startVelocity: 60 });
              }
            }, 1000);
          };

          if (phase === 'BOX') {
            return (
              <div className="h-screen flex flex-col items-center justify-center p-4 text-center bg-green-50">
                <h1 className="font-fun text-5xl text-red-600 mb-4">You have a gift!</h1>
                <p className="text-green-600 font-bold uppercase tracking-widest mb-10 animate-pulse">Tap to Open</p>
                <div onClick={openGift} className="cursor-pointer shake-gift">
                  <div className="w-64 h-64 bg-red-600 rounded-3xl shadow-xl relative border-4 border-red-800 flex items-center justify-center">
                    <div className="absolute w-full h-12 bg-yellow-400 top-1/2 -translate-y-1/2"></div>
                    <div className="absolute h-full w-12 bg-yellow-400 left-1/2 -translate-x-1/2"></div>
                    <span className="text-6xl z-10">🎁</span>
                  </div>
                </div>
              </div>
            );
          }

          if (phase === 'COUNTDOWN') {
            return (
              <div className="h-screen flex items-center justify-center bg-red-600">
                <h1 className="font-fun text-[12rem] text-white animate-ping">{count}</h1>
              </div>
            );
          }

          if (phase === 'CARD') {
            return (
              <div className="h-screen flex flex-col items-center justify-center p-4 bg-red-50 text-center animate-pop">
                <div className="snow-card w-full max-w-sm p-8 border-t-8 border-green-500 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-24 bg-green-100 opacity-50 z-0"></div>
                  <div className="relative z-10">
                    <p className="text-sm font-bold text-green-700 uppercase tracking-widest mb-6">Your Secret Mission</p>
                    <div className="text-5xl font-fun text-red-600 mb-8 drop-shadow-sm">{myMatch.name}</div>
                    
                    <div className="bg-yellow-50 p-6 rounded-2xl border-2 border-yellow-200 text-yellow-900 shadow-inner transform rotate-1">
                      <p className="text-xs font-bold uppercase opacity-60 mb-2">They asked for</p>
                      <p className="text-2xl font-bold font-fun">"{myMatch.wish}"</p>
                    </div>
                    
                    <p className="text-xs text-gray-400 mt-8 font-bold animate-pulse">📸 Screenshot before it disappears!</p>
                  </div>
                </div>
                <button onClick={() => window.location.href = window.location.pathname} className="mt-8 text-red-300 underline">Exit</button>
              </div>
            );
          }
        }

        return null;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
