<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa's Party 🎄</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- PeerJS (The Magic P2P Library) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Rubik:wght@400;700&display=swap');
      
      body {
        font-family: 'Rubik', sans-serif;
        background-color: #f0fdf4; /* Light Green */
        background-image: radial-gradient(#dcfce7 2px, transparent 2px);
        background-size: 20px 20px;
        color: #166534;
      }
      
      .font-hand { font-family: 'Patrick Hand', cursive; }
      
      .card {
        background: white;
        border: 3px solid #166534;
        box-shadow: 8px 8px 0px #166534;
        border-radius: 1rem;
        transition: transform 0.1s;
      }

      .btn-primary {
        background: #dc2626; /* Red */
        color: white;
        font-weight: bold;
        border: 2px solid #991b1b;
        box-shadow: 4px 4px 0px #991b1b;
        border-radius: 0.75rem;
        transition: all 0.1s;
      }
      .btn-primary:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #991b1b;
      }
      .btn-primary:disabled {
        background: #fca5a5;
        border-color: #fecaca;
        box-shadow: none;
        cursor: not-allowed;
      }

      .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // --- HELPERS ---
      // Generate a short random ID for the room
      const generateId = () => Math.random().toString(36).substring(2, 6).toUpperCase();

      // --- APP COMPONENT ---
      const App = () => {
        const [mode, setMode] = useState('START'); // START, HOST, GUEST
        const [peer, setPeer] = useState(null);
        const [conn, setConn] = useState(null); // For Guest: connection to host
        const [conns, setConns] = useState([]); // For Host: list of connections
        const [myId, setMyId] = useState("");
        const [hostId, setHostId] = useState("");
        const [players, setPlayers] = useState([]); // { id, name, funFact }
        const [status, setStatus] = useState(""); 
        
        // Guest State
        const [myName, setMyName] = useState("");
        const [myFunFact, setMyFunFact] = useState("");
        const [joined, setJoined] = useState(false);
        const [myMatch, setMyMatch] = useState(null); // { name, funFact }

        // --- HOST LOGIC ---
        const startHost = () => {
          const id = generateId();
          setMyId(id);
          setStatus("Creating Party Room...");
          
          const p = new Peer(id, { debug: 2 });
          
          p.on('open', (id) => {
            setMode('HOST');
            setStatus("Ready! Waiting for friends...");
            setPlayers([]); // Host doesn't play effectively in this simplified version, or can add themselves via a specialized UI, but let's keep it simple: Host manages. 
            // Actually, Host usually wants to play. We will add a "Join as Host" form in the Host View.
          });

          p.on('connection', (c) => {
            console.log("New connection:", c.peer);
            
            c.on('open', () => {
              // Add to connections list
              setConns(prev => [...prev, c]);
              
              // Listen for data from this guest
              c.on('data', (data) => {
                if (data.type === 'JOIN') {
                  setPlayers(prev => {
                    // Avoid duplicates
                    const filtered = prev.filter(pl => pl.id !== c.peer);
                    return [...filtered, { id: c.peer, name: data.name, funFact: data.funFact }];
                  });
                }
              });
              
              // Handle disconnect
              c.on('close', () => {
                setPlayers(prev => prev.filter(pl => pl.id !== c.peer));
                setConns(prev => prev.filter(cn => cn.peer !== c.peer));
              });
            });
          });

          p.on('error', (err) => {
            console.error(err);
            alert("Connection Error: " + err.type);
          });

          setPeer(p);
        };

        const shuffleAndSend = () => {
          if (players.length < 2) return alert("Need at least 2 players!");
          
          // Derangement Shuffle
          let shuffled = [...players];
          let valid = false;
          let attempts = 0;
          
          while(!valid && attempts < 100) {
            attempts++;
            // Shuffle
            for (let i = shuffled.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            // Check
            valid = true;
            for(let i=0; i<players.length; i++) {
              if (players[i].id === shuffled[i].id) { valid = false; break; }
            }
          }

          if (!valid) return alert("Shuffle failed. Add more people!");

          // Send results
          players.forEach((p, i) => {
            const target = shuffled[i];
            const connection = conns.find(c => c.peer === p.id);
            if (connection) {
              connection.send({
                type: 'REVEAL',
                targetName: target.name,
                targetFact: target.funFact
              });
            }
          });

          // Also check if Host is playing (if we added Host to players list logic, simpler to keep Host as pure server for this demo to ensure stability)
          setStatus("Pairs Sent!");
          window.confetti();
        };

        // --- GUEST LOGIC ---
        useEffect(() => {
          // Check URL for Join Code
          const params = new URLSearchParams(window.location.search);
          const room = params.get('room');
          if (room) {
            setHostId(room);
            setMode('GUEST_JOIN');
          }
        }, []);

        const joinRoom = () => {
          if (!myName || !myFunFact) return alert("Fill in the fields!");
          setStatus("Connecting to Host...");
          
          const p = new Peer(null, { debug: 2 }); // Auto-gen ID for guest
          
          p.on('open', (id) => {
            const c = p.connect(hostId);
            
            c.on('open', () => {
              setStatus("Connected! Waiting for host...");
              setJoined(true);
              setMode('GUEST_WAIT');
              
              // Send my info
              c.send({
                type: 'JOIN',
                name: myName,
                funFact: myFunFact
              });
            });

            c.on('data', (data) => {
              if (data.type === 'REVEAL') {
                setMyMatch({ name: data.targetName, funFact: data.targetFact });
                setMode('GUEST_REVEAL');
                window.confetti();
              }
            });
            
            c.on('close', () => alert("Host disconnected!"));
            setConn(c);
          });
          
          p.on('error', (err) => {
             console.error(err);
             alert("Could not connect to room " + hostId + ". Is the Host page open?");
             setMode('START');
          });

          setPeer(p);
        };

        // --- VIEWS ---

        if (mode === 'START') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="card max-w-md w-full p-8 text-center space-y-8 animate-pop">
                <div className="text-6xl animate-bounce">🎅</div>
                <div>
                  <h1 className="font-hand text-5xl text-red-600 font-bold">Santa's Party</h1>
                  <p className="text-green-800 mt-2">The Real-Time Secret Santa Game</p>
                </div>
                
                <button onClick={startHost} className="btn-primary w-full py-4 text-xl flex items-center justify-center gap-2">
                  <span>👑</span> Host a Party
                </button>
                
                <div className="relative">
                  <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-green-200"></div></div>
                  <div className="relative flex justify-center text-sm bg-white px-2 text-gray-400">OR</div>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); setMode('GUEST_JOIN'); }} className="flex gap-2">
                  <input 
                    value={hostId}
                    onChange={e => setHostId(e.target.value.toUpperCase())}
                    placeholder="ENTER ROOM CODE"
                    className="flex-1 border-2 border-green-200 rounded-lg p-3 text-center uppercase font-bold tracking-widest outline-none focus:border-green-600"
                    maxLength={4}
                  />
                  <button className="bg-green-600 text-white font-bold rounded-lg px-6 hover:bg-green-700 transition">JOIN</button>
                </form>
              </div>
            </div>
          );
        }

        if (mode === 'HOST') {
          const shareUrl = `${window.location.origin}${window.location.pathname}?room=${myId}`;
          
          return (
            <div className="min-h-screen p-4 pb-20 max-w-lg mx-auto">
               <div className="text-center mb-6 pt-6">
                 <div className="inline-block bg-yellow-100 border-2 border-yellow-400 text-yellow-800 px-4 py-2 rounded-full font-bold text-xl mb-4 tracking-widest">
                   ROOM: {myId}
                 </div>
                 <h2 className="text-3xl font-hand font-bold text-green-800">Host Dashboard</h2>
                 <p className="text-sm text-green-600">Keep this page open!</p>
               </div>

               <div className="card p-6 mb-6">
                 <p className="font-bold text-gray-500 text-xs uppercase mb-2">Invite Friends</p>
                 <div className="bg-gray-100 p-3 rounded-lg break-all text-xs font-mono border mb-4">
                   {shareUrl}
                 </div>
                 <button 
                    onClick={() => { navigator.clipboard.writeText(shareUrl); alert("Copied!"); }}
                    className="w-full bg-green-100 text-green-700 font-bold py-2 rounded-lg hover:bg-green-200 border border-green-300"
                 >
                   Copy Link
                 </button>
               </div>

               <div className="space-y-3 mb-24">
                 <h3 className="font-bold text-green-800 ml-2">Who's Here ({players.length})</h3>
                 {players.map(p => (
                   <div key={p.id} className="bg-white border-2 border-green-100 p-3 rounded-xl flex items-center justify-between animate-pop">
                     <div>
                       <div className="font-bold text-green-900">{p.name}</div>
                       <div className="text-xs text-green-600 italic">"{p.funFact}"</div>
                     </div>
                     <span className="text-2xl">🎁</span>
                   </div>
                 ))}
                 {players.length === 0 && <div className="text-center py-8 text-green-800/50 italic">Waiting for elves to join...</div>}
               </div>

               <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur border-t-2 border-green-100">
                 <div className="max-w-lg mx-auto">
                   <button 
                     onClick={shuffleAndSend}
                     className="btn-primary w-full py-4 text-xl"
                   >
                     Shuffle & Confirm ✅
                   </button>
                 </div>
               </div>
            </div>
          );
        }

        if (mode === 'GUEST_JOIN') {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="card max-w-md w-full p-8 space-y-6 animate-pop">
                <div className="text-center">
                  <div className="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold mb-2">ROOM {hostId}</div>
                  <h2 className="text-3xl font-hand font-bold text-red-600">Join the Fun</h2>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-green-800 uppercase mb-1">Your Name</label>
                    <input 
                      value={myName} onChange={e => setMyName(e.target.value)}
                      className="w-full border-2 border-green-200 rounded-lg p-3 outline-none focus:border-red-500 font-bold text-lg"
                      placeholder="e.g. Elf Buddy"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-green-800 uppercase mb-1">Funny Hint / Weird Fact</label>
                    <input 
                      value={myFunFact} onChange={e => setMyFunFact(e.target.value)}
                      className="w-full border-2 border-green-200 rounded-lg p-3 outline-none focus:border-red-500"
                      placeholder="e.g. I hate chocolate"
                    />
                  </div>
                  <button onClick={joinRoom} className="btn-primary w-full py-3 text-lg">
                    Enter Party ➔
                  </button>
                </div>
              </div>
            </div>
          );
        }

        if (mode === 'GUEST_WAIT') {
          return (
             <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
               <div className="text-6xl animate-bounce mb-6">⏳</div>
               <h2 className="text-3xl font-hand font-bold text-green-900 mb-2">You're In!</h2>
               <p className="text-green-700">Waiting for the Admin to press the big red button...</p>
               <div className="mt-8 p-4 bg-green-100 rounded-xl text-green-800 text-sm border border-green-200 max-w-xs">
                 Don't close this window, or you'll lose your spot in the circle!
               </div>
             </div>
          );
        }

        if (mode === 'GUEST_REVEAL') {
          const [isOpen, setIsOpen] = useState(false);
          
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center">
              <h1 className="font-hand text-4xl font-bold text-red-600 mb-2">Secret Santa</h1>
              <p className="text-green-800 mb-8 font-bold uppercase tracking-widest text-xs">Mission Received</p>
              
              {!isOpen ? (
                 <button 
                   onClick={() => { setIsOpen(true); window.confetti(); }}
                   className="w-64 h-64 bg-red-500 rounded-xl shadow-[0_10px_0_#991b1b] border-4 border-red-700 flex flex-col items-center justify-center text-white active:translate-y-2 active:shadow-none transition"
                 >
                   <span className="text-6xl mb-2">🎁</span>
                   <span className="font-hand text-3xl font-bold">OPEN ME</span>
                 </button>
              ) : (
                <div className="card w-full max-w-sm p-8 animate-pop">
                  <p className="text-xs font-bold text-gray-400 uppercase mb-4">You are getting a gift for</p>
                  <div className="text-5xl font-hand font-bold text-green-800 mb-6">{myMatch.name}</div>
                  
                  <div className="bg-yellow-50 p-4 rounded-xl border-2 border-yellow-200 text-yellow-800 relative">
                    <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-yellow-200 text-yellow-900 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">
                      Useful Hint
                    </div>
                    <p className="font-hand text-xl">"{myMatch.funFact}"</p>
                  </div>
                  
                  <p className="text-xs text-gray-400 mt-8 italic">Take a screenshot! If you refresh, this might disappear.</p>
                </div>
              )}
            </div>
          );
        }

        return <div>Loading...</div>;
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
